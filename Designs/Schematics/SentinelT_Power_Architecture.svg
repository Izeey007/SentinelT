<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill:#202020; }
    .title { font-size:30px; font-weight:700; }
    .box { fill:#fafafa; stroke:#222; stroke-width:2; }
    .safe { fill:#fff5f5; stroke:#991b1b; stroke-width:2.5; }
    .line { stroke:#222; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    .bold { font-weight:700; }
  </style>
  <rect width="900" height="1200" fill="white"/>
  <text x="40" y="55" class="title">SentinelT Power &amp; E-Stop Architecture</text>
  <text x="40" y="82" font-size="14" fill="#666">2.4 GHz RC | Main ON/OFF | Independent emergency power-disable path</text>

  <rect x="190" y="115" rx="12" width="520" height="92" class="box"/>
  <text x="450" y="153" text-anchor="middle" font-size="20" class="bold">3S LiPo Battery</text>
  <text x="450" y="180" text-anchor="middle" font-size="13">Primary energy source</text>

  <rect x="190" y="260" rx="12" width="520" height="92" class="box"/>
  <text x="450" y="298" text-anchor="middle" font-size="20" class="bold">Main Fuse / Protection</text>
  <text x="450" y="325" text-anchor="middle" font-size="13">High-current battery protection</text>

  <rect x="190" y="405" rx="12" width="520" height="92" class="box"/>
  <text x="450" y="443" text-anchor="middle" font-size="20" class="bold">MAIN ON/OFF ISOLATOR</text>
  <text x="450" y="470" text-anchor="middle" font-size="13">Accessible primary robot power isolation</text>

  <rect x="190" y="550" rx="12" width="520" height="92" class="safe"/>
  <text x="450" y="588" text-anchor="middle" font-size="20" class="bold" fill="#991b1b">E-STOP PUSHBUTTON</text>
  <text x="450" y="615" text-anchor="middle" font-size="13">Operator emergency command input</text>

  <rect x="190" y="695" rx="12" width="520" height="92" class="safe"/>
  <text x="450" y="733" text-anchor="middle" font-size="20" class="bold" fill="#991b1b">HIGH-CURRENT RELAY / CONTACTOR</text>
  <text x="450" y="760" text-anchor="middle" font-size="13">Interrupts actuator power when E-Stop is activated</text>

  <rect x="190" y="840" rx="12" width="520" height="92" class="box"/>
  <text x="450" y="878" text-anchor="middle" font-size="20" class="bold">POWER DISTRIBUTION</text>
  <text x="450" y="905" text-anchor="middle" font-size="13">Feeds drive, control and auxiliary branches</text>

  <path d="M450 207 L450 255" class="line"/>
  <path d="M450 352 L450 400" class="line"/>
  <path d="M450 497 L450 545" class="line"/>
  <path d="M450 642 L450 690" class="line"/>
  <path d="M450 787 L450 835" class="line"/>

  <rect x="65" y="995" rx="10" width="220" height="90" class="box"/>
  <text x="175" y="1033" text-anchor="middle" font-size="18" class="bold">DRIVE BRANCH</text>
  <text x="175" y="1060" text-anchor="middle" font-size="12">Dual brushed ESC -&gt; motors</text>

  <rect x="615" y="995" rx="10" width="220" height="90" class="box"/>
  <text x="725" y="1033" text-anchor="middle" font-size="18" class="bold">CONTROL BRANCH</text>
  <text x="725" y="1060" text-anchor="middle" font-size="12">2.4 GHz RC + safe-state logic</text>

  <rect x="340" y="1095" rx="10" width="220" height="70" class="box"/>
  <text x="450" y="1138" text-anchor="middle" font-size="18" class="bold">AUXILIARY BRANCH</text>

  <path d="M450 932 L450 960 L175 960 L175 990" class="line"/>
  <path d="M450 960 L725 960 L725 990" class="line"/>
  <path d="M450 960 L450 1090" class="line"/>
</svg>