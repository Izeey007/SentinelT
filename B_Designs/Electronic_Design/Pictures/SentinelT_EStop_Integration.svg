<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#202020}.box{fill:#fafafa;stroke:#222;stroke-width:3}.safe{fill:#fff2f2;stroke:#991b1b;stroke-width:4}.line{stroke:#222;stroke-width:4;fill:none;marker-end:url(#arr)}.dash{stroke:#991b1b;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#arr)}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.s{font-size:18px}</style>
<rect width="1200" height="700" fill="white"/>
<text x="50" y="60" class="t">SentinelT E-Stop Integration</text>
<text x="50" y="95" class="s">Fail-safe concept: the mushroom switch controls a separate high-current isolation device.</text>
<rect x="60" y="210" rx="16" width="220" height="125" class="box"/><text x="170" y="260" text-anchor="middle" class="h">3S LiPo</text><text x="170" y="292" text-anchor="middle" class="s">Battery</text>
<rect x="350" y="210" rx="16" width="220" height="125" class="box"/><text x="460" y="260" text-anchor="middle" class="h">Main ON/OFF</text><text x="460" y="292" text-anchor="middle" class="s">Isolator</text>
<rect x="640" y="210" rx="16" width="220" height="125" class="safe"/><text x="750" y="257" text-anchor="middle" class="h" fill="#991b1b">Contactor</text><text x="750" y="289" text-anchor="middle" class="s">High-current contacts</text>
<rect x="930" y="210" rx="16" width="220" height="125" class="box"/><text x="1040" y="260" text-anchor="middle" class="h">Actuator Bus</text><text x="1040" y="292" text-anchor="middle" class="s">Drive + auxiliary</text>
<path d="M280 272 L340 272" class="line"/><path d="M570 272 L630 272" class="line"/><path d="M860 272 L920 272" class="line"/>
<rect x="460" y="455" rx="16" width="280" height="125" class="safe"/><text x="600" y="505" text-anchor="middle" class="h" fill="#991b1b">E-STOP PUSHBUTTON</text><text x="600" y="540" text-anchor="middle" class="s">Normally-closed control loop</text>
<path d="M600 455 L600 390 L750 390 L750 345" class="dash"/>
<text x="780" y="405" class="s" fill="#991b1b">Pressing E-Stop opens control loop</text><text x="780" y="435" class="s" fill="#991b1b">and de-energizes the contactor.</text>
<text x="60" y="650" class="s">The E-Stop does not rely on software to remove actuator power. Software safe-state logic is an additional control layer.</text>
</svg>