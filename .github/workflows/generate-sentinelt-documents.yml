name: Generate SentinelT documents

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-sentinelt-documents.yml

permissions:
  contents: write

jobs:
  build-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document dependencies
        run: python -m pip install --disable-pip-version-check reportlab pillow pypdf

      - name: Generate SentinelT PDFs
        run: python Documentation/generate_documents.py

      - name: Materialize project-owner photo
        shell: bash
        run: |
          base64 -d Documentation/Pitch_Deck/Thato_Glen_Assegaai_photo.b64 > Documentation/Pitch_Deck/Thato_Glen_Assegaai.jpg
          rm -f Documentation/Pitch_Deck/Thato_Glen_Assegaai_photo.b64
          rm -rf .pdf_upload

      - name: Validate PDF format and page counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          expected = {
              Path('Documentation/Pitch_Deck/SentinelT_Pitch_Deck.pdf'): 7,
              Path('Documentation/Holistic_Build_Document/SentinelT_Holistic_Build_Document.pdf'): 10,
          }
          for path, pages in expected.items():
              reader = PdfReader(str(path))
              assert len(reader.pages) == pages, (path, len(reader.pages), pages)
              for page in reader.pages:
                  w = float(page.mediabox.width)
                  h = float(page.mediabox.height)
                  assert abs(w - 595.28) < 2 and abs(h - 841.89) < 2, (path, w, h)
              assert path.stat().st_size > 50000, (path, path.stat().st_size)
              print(path, path.stat().st_size, 'bytes', pages, 'pages')
          PY
          sha256sum Documentation/Pitch_Deck/SentinelT_Pitch_Deck.pdf Documentation/Holistic_Build_Document/SentinelT_Holistic_Build_Document.pdf

      - name: Commit generated documents
        shell: bash
        run: |
          git config user.name 'Izeey007'
          git config user.email 'izeeyrosy@gmail.com'
          git add -A Documentation/Pitch_Deck Documentation/Holistic_Build_Document .pdf_upload
          git status --short
          if git diff --cached --quiet; then
            echo 'No document changes to commit.'
            exit 0
          fi
          git commit -m 'Replace SentinelT documents with readable PDFs'
          git push
